
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'dbt_retention_analytics'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'dbt_retention_analytics'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

vars:
  # Analysis window. Participants exported their data between Nov 2022 and Mar 2023,
  # so months from Nov 2022 onward are missing purchases for part of the panel.
  analysis_start_date: '2018-01-01'
  analysis_end_date: '2022-10-31'

  # Forecasting
  forecast_horizon_months: 3         # how many months ahead to forecast (and backtest); must be <= 12
  forecast_min_train_months: 24      # seasonal methods need two full years of history
  forecast_moving_average_months: 3  # window for the moving_average method

  # Category repurchase
  category_lookback_months: 12       # no purchase in the category for this long = "new to category"
  category_min_new_buyers: 100       # hide categories too small to measure

  # Privacy: never publish a segment smaller than this
  segment_min_customers: 50


models:
  dbt_retention_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    mart:
      +materialized: table
      +schema: mart
