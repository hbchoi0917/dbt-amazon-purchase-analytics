version: 2

models:
  - name: int_customer_cohorts
    description: >
      Each transaction enriched with the customer's cohort month (month of first
      purchase) and the month_offset (months elapsed since cohort entry).
      Used as the single source of truth for all cohort-based retention models.
    columns:
      - name: transaction_id
        description: Unique transaction identifier.
        tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to stg_customers.
        tests:
          - not_null
      - name: transaction_date
        description: Date the transaction occurred.
        tests:
          - not_null
      - name: product_category
        description: Product category of the transaction.
        tests:
          - not_null
      - name: total_amount
        description: Transaction revenue.
        tests:
          - not_null
      - name: cohort_month
        description: Month of the customer's first-ever purchase (date_trunc to month).
        tests:
          - not_null
      - name: month_offset
        description: >
          Integer number of months between cohort_month and the transaction month.
          0 = acquisition month, 1 = first full month after acquisition, etc.
        tests:
          - not_null

  - name: int_monthly_revenue
    description: >
      One row per calendar month from the first to the latest transaction month.
      Months without sales are kept with revenue = 0 (date spine), and the
      in-progress final month is flagged so forecasts train on complete months only.
    columns:
      - name: revenue_month
        description: First day of the calendar month.
        tests:
          - unique
          - not_null
      - name: revenue
        description: Sum of total_amount for the month.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
      - name: order_count
        description: Number of transactions in the month.
        tests:
          - not_null
      - name: customer_count
        description: Distinct customers who purchased in the month.
        tests:
          - not_null
      - name: is_complete_month
        description: >
          True when data exists through the month's last day. The latest month
          (2024-01, one day of data) is false and excluded from forecasting.
        tests:
          - not_null

  - name: int_revenue_forecast_fits
    description: >
      Forecast parameters for every method at every training cutoff (origin_month),
      fitted on an expanding window of complete months up to and including the
      origin. forecast(h) = base_level + trend_slope * h. Earlier origins feed the
      backtest; the latest origin drives the live forecast.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['origin_month', 'method']
    columns:
      - name: origin_month
        description: Last complete month the method was allowed to see.
        tests:
          - not_null
      - name: train_months
        description: Number of complete months in the training window.
        tests:
          - not_null
      - name: method
        description: >
          naive (last month), historical_mean (mean of all training months),
          moving_average (mean of the last N months), linear_trend (OLS on month index).
        tests:
          - not_null
          - accepted_values:
              values: ['naive', 'historical_mean', 'moving_average', 'linear_trend']
      - name: base_level
        description: Forecast level at the origin month.
        tests:
          - not_null
      - name: trend_slope
        description: Revenue change per month (0 for level-only methods).
        tests:
          - not_null
